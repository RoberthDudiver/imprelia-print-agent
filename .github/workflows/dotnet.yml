name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\GastroManager.PrintAgent.sln

      - name: Build
        run: dotnet build .\GastroManager.PrintAgent.sln --configuration Release --no-restore

      - name: Restore runtime packages
        run: dotnet restore .\Imprelia.PrintAgent.csproj -r win-x64

      - name: Build MSI installer
        run: dotnet build .\installer\Imprelia.PrintAgent.Installer.wixproj --configuration Release -p:ProductVersion=1.0.0

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImpreliaPrintAgent-Setup
          path: installer/bin/Release/*.msi
